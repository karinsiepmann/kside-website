:root { --rot:#962B3F; --orange:#F0762B; --gruen:#A3C770; --braun:#8C6A4B; --ink:#141413; --line:#3a3530; --bg:#faf9f5; --grey:#666; }
* { margin:0; padding:0; box-sizing:border-box; }
html, body { height:100%; background:var(--bg); overflow:hidden; font-family:'Montserrat', Inter, 'Open Sans', Arial, sans-serif; color:var(--ink); }
#stage { width:100vw; height:100vh; display:block; }
svg text { font-family:'Montserrat', Inter, Arial, sans-serif; }
.t-ink { fill:var(--ink); } .t-grey { fill:var(--grey); } .t-rot { fill:var(--rot); }
.sk { stroke:var(--line); stroke-width:2.2; stroke-linecap:round; stroke-linejoin:round; }
.scene { visibility:hidden; }
#overlay { position:fixed; inset:0; display:flex; flex-direction:column; align-items:flex-start; justify-content:center; padding:0 9vw; background:var(--bg); gap:1.5rem; z-index:5; }
#overlay .mark { font-weight:700; font-size:1.3rem; }
#overlay h1 { font-size:clamp(2.2rem, 5.2vw, 4.4rem); font-weight:700; color:var(--rot); line-height:1.1; }
#overlay h1 span { color:var(--ink); }
#overlay .event { display:flex; align-items:center; gap:1rem; font-size:clamp(1rem, 1.6vw, 1.3rem); color:#444; }
#overlay .event img { height:3.6rem; width:auto; }
#overlay p { font-size:clamp(.95rem, 1.3vw, 1.1rem); color:var(--grey); }
.btn { font:600 1.15rem 'Montserrat', Arial, sans-serif; background:var(--rot); color:#fff; border:0; border-radius:6px; padding:.95rem 2.2rem; cursor:pointer; }
.btn:hover, .btn:focus-visible { background:#7d2334; outline:3px solid var(--orange); outline-offset:3px; }
.keys { font-size:.9rem; color:var(--grey); }
.keys kbd { font:600 .8rem 'Montserrat', Arial; border:1px solid #ccc; border-radius:4px; padding:.1rem .4rem; background:#fff; }
#replay { position:fixed; right:3vw; bottom:3.2vh; z-index:4; display:none; }
#hint { position:fixed; right:2vw; top:2vh; font-size:.8rem; color:var(--grey); z-index:4; opacity:0; transition:opacity .4s; }
</style>
</head>

<svg id="stage" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid meet" aria-label="Animierter Teaser: Komplexes Wissen mit KI greifbar machen">
  <defs>
    <filter id="sketch" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>

  <!-- Feininger-Komposition -->
  <g id="comp">
    <g class="cp"><rect x="1080" y="250" width="250" height="370" fill="#962B3F" fill-opacity=".45" class="sk" filter="url(#sketch)"/></g>
    <g class="cp"><rect x="1225" y="380" width="235" height="300" fill="#8C6A4B" fill-opacity=".38" class="sk" filter="url(#sketch)"/></g>
    <g class="cp"><polygon points="1040,700 1290,215 1420,700" fill="#F0762B" fill-opacity=".42" class="sk" filter="url(#sketch)"/></g>
    <g class="cp"><circle cx="1390" cy="290" r="88" fill="#A3C770" fill-opacity=".5" class="sk" filter="url(#sketch)"/></g>
    <g class="cp"><g fill="none" class="sk" filter="url(#sketch)"><rect x="1115" y="300" width="90" height="120"/><line x1="1160" y1="300" x2="1160" y2="420"/><line x1="1115" y1="360" x2="1205" y2="360"/></g></g>
    <g class="cp"><polyline points="1060,690 1060,650 1110,650 1110,610 1160,610 1160,570 1210,570 1210,530" fill="none" class="sk" filter="url(#sketch)"/></g>
  </g>

  <!-- Intro -->
  <g id="s1" class="scene">
    <g id="s1text" font-size="26" class="t-ink">
      <text class="l1" x="120" y="220">Die Zuwendung wird im Wege der Projektförderung als nicht</text>
      <text class="l1" x="120" y="262">rückzahlbarer Zuschuss in Form einer Anteilfinanzierung</text>
      <text class="l1" x="120" y="304">gewährt, sofern die zuwendungsfähigen Ausgaben unter</text>
      <text class="l1" x="120" y="346">Berücksichtigung der Nr. 1.2 ANBest-P sowie etwaiger</text>
      <text class="l1" x="120" y="388">Drittmittel und Eigenleistungen im Verwendungsnachweis</text>
      <text class="l1" x="120" y="430">nachvollziehbar dargelegt werden ...</text>
    </g>
    <text id="s1h" x="120" y="620" font-size="60" font-weight="700" class="t-rot">Schon mal nur Bahnhof verstanden?</text>
    <text id="s1s" x="120" y="690" font-size="30" class="t-ink">Das liegt selten an dir - sondern oft an der <tspan font-weight="700">Form</tspan>.</text>
  </g>

  <!-- 01 kompliziert / komplex -->
  <g id="s2" class="scene">
    <text class="ttl" x="120" y="150" font-size="54" font-weight="700" fill="#962B3F">Kompliziert oder komplex?</text>
    <rect id="hlL" x="150" y="222" width="10" height="42" fill="#8C6A4B" fill-opacity=".35"/>
    <text id="hdL" x="160" y="254" font-size="34" font-weight="700" class="t-ink">kompliziert</text>
    <g id="grid"></g>
    <path id="gridframe" d="M228,278 L482,278 L482,532 L228,532 Z" fill="none" class="sk" filter="url(#sketch)"/>
    <text class="s2l t-ink" x="160" y="610" font-size="28">Viele Teile - aber <tspan font-weight="700">lösbar</tspan>.</text>
    <text class="s2le" x="160" y="660" font-size="20" fill="#666">z.B. einen Förderantrag ausfüllen</text>
    <path id="divider" d="M800,230 L803,720" fill="none" class="sk" filter="url(#sketch)"/>
    <rect id="hlR" x="870" y="222" width="10" height="42" fill="#F0762B" fill-opacity=".38"/>
    <text id="hdR" x="880" y="254" font-size="34" font-weight="700" class="t-ink">komplex</text>
    <g id="edges" class="sk" fill="none"></g>
    <g id="nodes"></g>
    <text class="s2r t-ink" x="880" y="610" font-size="28">Alles hängt zusammen - <tspan font-weight="700">verstehbar</tspan>.</text>
    <text class="s2re" x="880" y="660" font-size="20" fill="#666">z.B. Engagement im Quartier stärken</text>
    <text id="s2p" x="120" y="790" font-size="30" font-weight="700" class="t-ink">Kompliziertes kann man <tspan fill="#962B3F">lösen</tspan>. Komplexes muss man <tspan fill="#962B3F">verstehen</tspan>.</text>
  </g>

  <!-- 01b Warum ist Verstehen schwer? -->
  <g id="s3" class="scene">
    <text class="ttl" x="120" y="150" font-size="54" font-weight="700" fill="#962B3F">Warum ist Verstehen manchmal schwer?</text>

<script>/* ------------------------------------------------------------------
   Musik: selbst komponiert & live im Browser erzeugt (Web Audio API).
   Keine Fremdaufnahme -> keine Lizenzfragen. 96 BPM, C-Dur, leicht.
   Töne werden erst kurz vor ihrem Einsatz erzeugt (Lookahead) -
   das verhindert Knistern beim Start.
   ------------------------------------------------------------------ */
const Music = (() => {
  const BPM = 96, BEAT = 60 / BPM, BAR = BEAT * 4, EIGHTH = BEAT / 2;
  const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
  const CH = {
    F:  { b: 41, t: [53, 57, 60, 64] },
    Am: { b: 45, t: [57, 60, 64, 67] },
    C:  { b: 48, t: [55, 59, 60, 64] },
    G:  { b: 43, t: [55, 59, 62, 64] },
    C9: { b: 36, t: [52, 55, 59, 62, 71] }
  };
  const PROG = ['F', 'Am', 'C', 'G'];
  const LAST = Math.round(S.card / BAR);               // Schlussakkord (Takt 37)
  const chordAt = b => (b >= LAST ? CH.C9 : b === LAST - 1 ? CH.G : b === LAST - 2 ? CH.F : CH[PROG[b % 4]]);

    dly = ctx.createGain(); dly.gain.value = 0.2;

    const g1 = ctx.createGain(); g1.gain.value = s.dry; node.connect(g1); g1.connect(dry);
    if (s.rev) { const g = ctx.createGain(); g.gain.value = s.rev; node.connect(g); g.connect(rev); }
    if (s.dly) { const g = ctx.createGain(); g.gain.value = s.dly; node.connect(g); g.connect(dly); }

    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(v, t + a);

  function pluck(t, m, v = 0.06, s = { dry: 1, rev: 0.35, dly: 0.45 }) {
    const o = ctx.createOscillator(), o2 = ctx.createOscillator(), g = ctx.createGain(), f = ctx.createBiquadFilter(), g2 = ctx.createGain();
    o.type = 'triangle'; o.frequency.value = mtof(m);
    o2.type = 'sine'; o2.frequency.value = mtof(m + 12); g2.gain.value = 0.25;
    f.type = 'lowpass'; f.frequency.value = 3000;
    o.connect(f); o2.connect(g2); g2.connect(f); f.connect(g);
    env(g, t, 0.008, v, 0.0001, t + 0.9);

    const g = ctx.createGain(), f = ctx.createBiquadFilter();

    const f = ctx.createBiquadFilter(); f.type = type; f.frequency.value = freq; f.Q.value = q;

    const { g } = noise(t, 0.12, 'highpass', 7000);

  }
  function whoosh(t, v = 0.06) {

      .forEach(([s, m]) => add(s, t => pluck(t, m, 0.035, { dry: 0.6, rev: 0.6, dly: 0.6 })));
    // Arpeggio ab Kapitel 1
    const PA = [0, 1, 2, 3, 2, 1, 2, 3], PB = [0, 2, 1, 3, 0, 2, 3, 1], PC = [3, 2, 1, 0, 1, 2, 3, 2];

    }
    // Bass ab "Wie Verstehen funktioniert"
    for (let b = Math.round(S.s3 / BAR); b < LAST; b++) {
      const ch = chordAt(b);
      add(b * BAR, t => bass(t, BEAT * 1.8, ch.b));
      add(b * BAR + 2 * BEAT, t => bass(t, BEAT * 1.8, ch.b + (b % 2 ? 7 : 12)));
    }
    add(LAST * BAR, t => bass(t, 5, 36, 0.13));
    // Shaker in den Anregungen
    for (let b = Math.round(S.e1 / BAR); b < Math.round(S.fin / BAR); b++)
      for (let i = 1; i < 8; i += 2) add(b * BAR + i * EIGHTH, t => shaker(t));
    CUES.whoosh.forEach(s => add(s, t => whoosh(t)));
    [72, 76, 79, 83, 84, 88, 91, 95].forEach((m, i) => add(CUES.sparkle + i * 0.06, t => pluck(t, m, 0.045)));
    CUES.plings.forEach(([s, m]) => add(s, t => bell(t, m)));
    [84, 88, 91].forEach((m, i) => add(CUES.finalBell + i * 0.02, t => bell(t, m, 0.06 - i * 0.01, 4)));

    return ev.sort((a, b) => a[0] - b[0]);
  }

  function pump() {
    const horizon = ctx.currentTime + 0.6;
    while (idx < events.length && t0 + events[idx][0] < horizon) {
      const tt = Math.max(t0 + events[idx][0], ctx.currentTime + 0.02);
      events[idx][1](tt); idx++;
    }
  }

  return {
    start(c, startAt) {
      this.stop(); ctx = c; t0 = startAt; setup(); events = compose(); idx = 0;
      pump(); timer = setInterval(pump, 60);
    },
    stop() { if (timer) clearInterval(timer); timer = null; },

      master.gain.cancelScheduledValues(ctx.currentTime);
      master.gain.setTargetAtTime(m ? 0 : level, ctx.currentTime, 0.05);
    }
  };
})();

const END = tl.duration();

const CHAPTERS = [[0, 'Intro'], [S.s2, '01  Warum ist etwas kompliziert oder komplex?'], [S.s4, '02  Warum und wie kann KI helfen?'], [S.e1, '03  Ein paar Anregungen'], [S.fin, 'Outro']];

/* ---------- Uhr: die Audiozeit steuert die Animation ---------- */
let ctx = null, t0 = 0, running = false, paused = false, muted = false, fallbackStart = 0, fallbackPausedAt = 0;
const now = () => ctx ? ctx.currentTime - t0 : (paused ? fallbackPausedAt : (performance.now() - fallbackStart) / 1000);
function render(t) {
  tl.time(t); updateEdges();
  $('#prog').setAttribute('width', 1480 * (t / END));
  let ch = CHAPTERS[0][1]; CHAPTERS.forEach(([s, l]) => { if (t >= s) ch = l; });
  if ($('#chap').textContent !== ch) $('#chap').textContent = ch;
}
gsap.ticker.add(() => {
  if (!running) return;
  const t = Math.min(Math.max(now(), 0), END);
  render(t);
  if (t >= END) { running = false; $('#replay').style.display = 'block'; }
});
function start() {
  $('#overlay').style.display = 'none'; $('#replay').style.display = 'none';
  Music.stop();
  if (ctx) { try { ctx.close(); } catch (e) {} ctx = null; }
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    ctx = new AC();
    t0 = ctx.currentTime + 0.4;
    Music.start(ctx, t0);
  } catch (e) { ctx = null; fallbackStart = performance.now(); }
  paused = false; running = true;
  const h = $('#hint'); h.style.opacity = 1; setTimeout(() => h.style.opacity = 0, 3000);
}
function togglePause() {
  if (!running) return;
  paused = !paused;
  if (ctx) paused ? ctx.suspend() : ctx.resume();
  else if (paused) fallbackPausedAt = now(); else fallbackStart = performance.now() - fallbackPausedAt * 1000;
}
$('#startBtn').addEventListener('click', start);
$('#replay').addEventListener('click', start);
document.addEventListener('keydown', e => {
  if (e.code === 'Space') { e.preventDefault(); if ($('#overlay').style.display !== 'none') start(); else togglePause(); }
  else if (e.key === 'r' || e.key === 'R') start();
  else if (e.key === 'm' || e.key === 'M') { muted = !muted; Music.setMuted(muted); }
  else if (e.key === 'f' || e.key === 'F') { document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen().catch(() => {}); }
});
const q = new URLSearchParams(location.search).get('t');
if (q !== null) { $('#overlay').style.display = 'none'; render(+q); }
window.__tl = tl;
})();
