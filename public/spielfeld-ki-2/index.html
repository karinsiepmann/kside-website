 (BNE) ist ein Querschnittsthema: Umwelt, gesellschaftliche Verantwortung und Wirkung gehören zur Auseinandersetzung mit KI dazu.","Wir reflektieren kritisch unsere eigene Rolle und die Zukunft von Schule und Hochschule. Es geht nicht um fertige Antworten, sondern darum, mögliche Zukünfte zu denken und mitzugestalten."]},{title:"Idee für ein Teaser-Video",points:["Im Zentrum steht eine lernende Person im Studium. Sie reflektiert ihren Auftrag, selbst zu lernen und andere zu begleiten. Beim Rauszoomen wird sichtbar, wer zur Gesellschaft gehört und wie sich ihre Lernstrukturen verändern."]}]},{id:"dienstag",category:"Konzept",title:"Der offene Dienstag und Karins Rolle",summary:"Vorgesehen ist ein Semester mit etwa 10 bis 15 Treffen. Jeden Dienstag von 15 bis 19 Uhr soll ein frei zugänglicher Lernraum mit Kommen-und-Gehen-Prinzip öffnen. Der Raum und die einzelnen Termine stehen noch nicht fest.",sections:[{title:"Leichter Rahmen",points:["Beim ersten Treffen stellt Karin die Idee, den Ablauf und das gemeinsame Spiel vor. Danach geben kleine thematische Impulse den Dienstagen Orientierung.","Vorschlag: 30 bis 45 Minuten Ankommen, 15 bis 20 Minuten Lernimpuls, dann optionale Kleingruppen und freies Lernen. Check-in, Show & Tell oder eine Abschlussfrage können zum Ritual werden.","Ein fester Raum wäre eine wiedererkennbare Anlaufstelle. Alternativ öffnet der Raum, in dem Karin ohnehin arbeitet, wenn er groß genug ist. Zu klären sind WLAN, Steckdosen, Gruppenplätze und Zugang für externe Gäste."]},{title:"Was Karin einbringt",points:["Am Anfang recherchiert Karin bestehende KI-Angebote, Projekte, Ansprechpersonen und Infrastruktur an der PH und in der Region. Sie sichtet, kuratiert und teilt die Funde im Informationsraum.","Dienstags ist sie ansprechbar, gibt Impulse und begleitet Kleingruppen. Mögliche weitere Aufgaben: Gäste einladen, Partner:innen anfragen, dokumentieren und die Spielentwicklung begleiten.","Ein Semesterkalender wird sinnvoll, sobald Zahl und Daten der Termine feststehen. Themen und Gast-Impulse können mit den Spielphasen verbunden werden."]}]},{id:"peer-learning",category:"Lernpraxis",title:"Peer Learning und Selbstorganisation",summary:"Kurze Impulse nach dem Vorbild des FemAI Lab treffen auf freies, selbstorganisiertes Lernen. Studierende und Lehrkräfte teilen ihr Wissen über Fachgrenzen hinweg und machen ihre Lernwege sichtbar.",sections:[{title:"Formate zum Ausprobieren",points:["Offene Peer-Learning-Circles, Lerntandems und Working Out Loud, zum Beispiel mit vier bis fünf Personen über zwölf Wochen.","Lernen durch Lehren, Show & Tell und Fail & Learn: Studierende zeigen, was sie versucht haben, erklären Methoden und sprechen offen über Fehler.","Feedback mit drei Fragen: Was gefällt? Was irritiert? Was wäre ein nächster Schritt?","Rotierende Gastgeber:innen, Selbstorganisation nach Laloux und agile Methoden praktisch ausprobieren. Lernjournale, Wikis, Kurzvideos und eine gemeinsame Prompt- und Use-Case-Bibliothek halten Wissen im Spielfeld."]},{title:"Offen bleibt",points:["Wie viel Struktur braucht Peer Learning, damit es trägt, und wie viel Freiheit, damit es lebt? Wie kann Beteiligung anerkannt werden?"]}]},{id:"mentoring",category:"Lernpraxis",title:"Mentoring als Beziehung auf Zeit",summary:"Mentoring ist keine Einbahnstraße. Beide Seiten lernen voneinander, etwa zu Studium, Berufseinstieg, Schulpraxis, KI-Nutzung und der eigenen Rolle als Lehrkraft.",sections:[{title:"Rahmen und Einstieg",points:["Tandems, 1:1- und Gruppenmentoring, Mentoring-Kreise oder Speed-Mentoring in 30 Minuten. Ziel, Dauer, Rhythmus, Vertraulichkeit und Abschluss werden gemeinsam vereinbart.","Matching nach Interessen und Fragen statt nur nach Fach oder Hierarchie. Eine Frag-mich-Sprechstunde und Gesprächskarten mit Impulsen erleichtern den Einstieg."]},{title:"Wer kann Mentor:in sein?",points:["Peer-Mentor:innen, Alumni und Studierende im Reverse Mentoring: Wer Erfahrung mit KI-Tools hat, kann sie auch an Lehrkräfte oder Professor:innen weitergeben.","Lehrkräfte in verschiedenen Berufsphasen, MINT-Fachleute, Zukunftscoaches, Menschen aus Zivilgesellschaft und Kommunen, externe Gäste und auch Schüler:innen als Impulsgeber:innen.","Viele kurze Beiträge im Mentoring-Mosaik, Begegnungen online mit anderen Hochschulen oder Erasmus+-Partnern und KI als reflektierte Sparringspartnerin. KI ergänzt den Austausch, sie ersetzt keine Person."]},{title:"Offen bleibt",points:["Wer entscheidet über das Matching? Wie bleibt Mentoring freiwillig und trotzdem verbindlich? Wie werden Wirkung und Engagement sichtbar, etwa durch Credits, Zertifikat oder Badge, ohne eine neue Prüfung einzuführen?"]}]},{id:"mint",category:"Lernpraxis",title:"MINT, Chemiedidaktik und Gender-Vielfalt",summary:"Die Chemiedidaktik ist der fachliche Anker. Perspektiven aus MINT, Geistes- und Sozialwissenschaften und Pädagogik machen das Spielfeld interdisziplinär.",sections:[{title:"KI in der MINT-Praxis",points:["Simulationen, Experimentieren, Erklärmodelle und Differenzierung im Chemieunterricht erkunden: erst ausprobieren, dann reflektieren.","Praxisfragen zu Nachhaltigkeit, Energie, Wasser oder Materialien mit KI und Fachwissen bearbeiten. Vorbilder aus Schule, Forschung und Berufspraxis kennenlernen.","Studierende können Schulprojekte begleiten, Lehrkräfte ins Labor kommen. Anbindungen an Schülerlabore und MINT-Initiativen sind zu prüfen. Mentoring kann Berufseinstieg und Bindung angesichts des Lehrkräftemangels unterstützen."]},{title:"Vielfalt bewusst gestalten",points:["Frauen und Gender-Vielfalt in MINT und KI sichtbar machen. Role Models einladen und mit Female Peer Circles, geschützten Lernzeiten oder offenen Räumen mit klarer Kultur experimentieren.","Selbstwirksamkeit und Imposter-Gefühl, Verhandeln, Netzwerken, Karrierewege und Vereinbarkeit in unterschiedlichen Lebensphasen thematisieren.","Bias in KI-Daten, Sprache und Bildern aus Genderperspektive untersuchen. Allies einbeziehen und gemeinsam entscheiden, was einen eigenen Raum und was einen Querschnittsfokus braucht."]}]},{id:"kompetenzen",category:"Lernpraxis",title:"Future Skills und KI-Readiness",summary:"Technische Neugier und Urteilskraft gehören zusammen. Wir probieren KI aus und fragen zugleich, wann ihr Einsatz sinnvoll ist und wo seine Grenzen liegen.",sections:[{title:"Mögliche Lerninhalte",points:["KI-Grundlagen, Tools, Skills, Automatisierungen, AIOS, Use Cases und Workflows. Ethik und Datenschutz werden von Anfang an mitgedacht.","Kreativtechniken, Design Thinking, Ideation, unternehmerisches Denken und Projektmanagement.","Selbstfürsorge und Selbstwirksamkeit, Perspektivwechsel und Kooperation über Fach-, Branchen-, Kultur- und Generationsgrenzen hinweg."]}]},{id:"zukuenfte",category:"Transfer",title:"Zukünfte gestalten: Impulse aus Koblenz",summary:"Das Futures Wheel (Zukunftsrad) macht direkte und weitere Folgen einer Veränderung sichtbar. Karin hat die Methode in Koblenz kennengelernt. Dass sie dort in Schulen getragen wird, ist ein möglicher Anknüpfungspunkt für den Transfer.",sections:[{title:"Anknüpfung an die HfGG-Mindmap",points:["Ausbildung und Begleitung von Zukunftscoaches, 4FutureLabs innerhalb und außerhalb der HfGG, Spirale Transformativen Lernens (STL) und Konzepte und Praktiken der Ökonomie.","Peer-Learning-Circles als Open Learning Lab an der HfGG und an dritten Lernorten, ergänzt durch Elemente der STL. BNE-Prototypen an der PH in zwei bis drei Iterationen und Erasmus+-Kooperationen (KA2) mitdenken.","Futures Wheel goes Kommune sowie ein bis zwei Pilot-Workshops in der Erwachsenenbildung und im lebenslangen Lernen."]},{title:"Variationen mit KI",points:["Zukunftsrad und Lernspirale als interaktive KI-Apps ausprobieren. Individuelle Zukunftsszenarien ausformulieren, etwa: Wie möchte ich nächstes Jahr sein?","Future Skills – The Game: Die 30 Skills aus dem Future Skills 2030 Framework könnten als KI-Personae mit Superkräften bei Challenges helfen, dokumentiert als skill.md und erlebbar in einer App.","Der Link zum Koblenzer Futures-Wheel-Konzept soll noch ergänzt werden. Die tldraw-Boards sind weiterführende Arbeitsmaterialien."]}],links:[{label:"Karins tldraw-Board 1",href:"https://www.tldraw.com/f/ch2JgutvCEjKPCAyaub7f?d=v-729.-22.637.1249.page"},{label:"Karins tldraw-Board 2",href:"https://www.tldraw.com/p/hYYHIMYWi1OlFBXyrSbsL?d=v-1061.-637.1411.2765.page"}]},{id:"netzwerk",category:"Transfer",title:"Vernetzung mit Gesellschaft und Wirtschaft",summary:"Das Lernlabor ist ein Knotenpunkt: Hochschule, Gesellschaft und Wirtschaft öffnen sich füreinander. Vernetzung ist selbst eine Lernform. Kleine Pilotprojekte und Beziehungen kommen vor großen Vereinbarungen.",sections:[{title:"Mögliche Partner",points:["Schulen aller Schulformen, Schülerlabore, Seminare für Lehrkräftebildung, Kommunen, Bibliotheken, Volkshochschulen, Vereine, NGOs, Nachhaltigkeitsinitiativen und Stiftungen.","Kirchen, Jugendarbeit, Sozialträger, Senior:innenorganisationen, Kultur, Medien, Hochschulen, Forschungsinstitute, Erasmus+-Partner, Bildungsverwaltung, Gesundheit, Pflege und Sport.","Chemie- und Pharmaindustrie, Materialwissenschaft, Energie, Wasser, Recycling, Start-ups, Handwerk, Mittelstand, Kammern, Verbände, KI- und EdTech-Unternehmen, Coworking-Spaces, Beratungen und Reallabore."]},{title:"Begegnungen und gemeinsame Arbeit",points:["Gast-Impulse, Besuche an anderen Lernorten, Praxisprojekte und Challenges, Demo Days, Mentoring-Mosaik, Ideathons, Hackathons und Zukunftswerkstätten.","Netzwerk-Calls, Hospitationen, Praktika und Co-Teaching zwischen Schule, Hochschule und Wirtschaft. MINT-Berufsbilder im direkten Kontakt sichtbar machen.","Lernen, Kontakte zu pflegen und Anliegen zu formulieren. Stakeholder-Mapping: Wer ist beteiligt, betroffen oder fehlt? Ergebnisse und Lernspuren in einem Wiki oder einer gemeinsamen Kontakt-Landkarte teilen.","Verteilte Verantwortung mit Gastgeber:innen für einzelne Beziehungen, kurze Vereinbarungen und Anschlüsse an Erasmus+ KA2, Stiftungen oder Transferprogramme. Wirkung mit Beispielen und Mini-Berichten zeigen."]},{title:"Offen bleibt",points:["Wen laden wir zuerst ein? Was haben Partner:innen langfristig davon? Wie schützen wir Datenschutz und Unabhängigkeit der Hochschule? Was ist im ersten Semester machbar und was bleibt Vision?"]}]},{id:"spiel",category:"Spiel",title:"Das gemeinsame Spiel als Semesterprojekt",summary:"Das Spielfeld wird wörtlich zum Spiel: Alle entwickeln gemeinsam mit KI ein Lernspiel. Die Teilnehmenden steuern Challenges aus der Chemie bei, aus dem laufenden Studium oder mit Blick auf den späteren Unterricht.",sections:[{title:"Warum ein Spiel?",points:["Ein gemeinsames Ziel verbindet die Dienstage. Wer eine Challenge baut, durchdringt den Fachinhalt und lernt, wie er für andere zugänglich und mit KI sinnvoll gestaltbar wird.","Chemie-Studierende bringen fachliche Tiefe, andere Fächer Perspektiven zu Story, Gestaltung, Ethik und Technik ein. Das sichtbare Produkt kann eine Alternative zum klassischen Assessment sein.","Das Ergebnis lässt sich im Unterricht einsetzen und Kooperationspartnern, Förderern oder im Teaser-Video zeigen."]},{title:"Die Form bleibt gemeinsam zu entscheiden",points:["Level, Welten oder Stationen; denkbar sind Quiz, Escape Room, Quest, Brett- oder Kartenspiel, KI-App oder eine hybride Form.","Eine Zukunftsstadt, Kreislaufwirtschaft oder ein Labor der Zukunft können als BNE-Rahmen dienen. Future-Skills-Personae oder ein Zukunftsrad machen unterschiedliche Wege und Folgen sichtbar.","Anfang: Idee, Geschichte und Regeln gemeinsam entwickeln. Mitte: Challenge-Werkstätten mit Prototyping, Peer-Feedback und Tests. Ende: zusammenbauen, mit Schüler:innen und Lehrkräften testen und am Demo Day zeigen. Danach ist eine offene Bildungsressource (OER) angedacht."]}]},{id:"challenges",category:"Spiel",title:"Bauplan für eine Challenge",summary:"Eine Challenge verbindet ein fachlich tragfähiges Lernziel mit einer spielbaren Aufgabe. Das Projektbeispiel zu Modellen von Atomen und Molekülen könnte als Muster dienen.",sections:[{title:"Was hineingehört",points:["Chemisches Thema und Lernziel in einem Satz, Zielgruppe oder Jahrgangsstufe und Zeitbedarf.","Eine Aufgabe oder Mission, optional eine Spielrolle. Eine begründete Entscheidung, wann KI hilft und wann bewusst ohne KI gedacht wird.","Lösung, Hinweise, Differenzierung, Reflexionsfrage zu Nachhaltigkeit, Gesellschaft oder Zukunft sowie Quellen- und fachlicher Qualitätscheck.","Peer-Feedback und Show & Tell nutzen. Fachleute, Schulen oder Praxispartner können Herausforderungen testen und Rückmeldung geben."]},{title:"Offen bleibt",points:["Eine Challenge pro Person oder pro Tandem? Wer prüft Fachlichkeit? Wie unterstützen Chemie-Tandems Beteiligte ohne Fachhintergrund?","Welche Plattform ist offen, datenschutzkonform und langfristig nutzbar? Welche Rechte und Lizenzen gelten, etwa CC BY und Umgang mit KI-Inhalten? Wer pflegt das Spiel und wie erweitert die nächste Kohorte die Sammlung?"]}]},{id:"informationsraum",category:"Konzept",title:"Der gemeinsame Informationsraum",summary:"Ein gemeinsam gepflegter Ort für kuratierte Funde und Lernspuren soll Wissen im Spielfeld halten. Los geht es mit Karins Erstrecherche zu KI-Angeboten an und um die PH.",sections:[{title:"Was dort Platz hat",points:["KI-Angebote und Ansprechpersonen, Tool- und Prompt-Bibliothek, Materialien und Impulse der Dienstage, Challenges, Lesetipps und eine Netzwerk-Landkarte.","Wiki, geteilte Ordner, ein digitales Board oder eine tldraw-Landkarte; ergänzend eine physische Infowand. Alle können nutzen und beitragen.","Einfach zu befüllen, klar strukturiert, datenschutzkonform und für die nächste Kohorte zugänglich. KI kann beim Zusammenfassen, Verschlagworten und Suchen helfen, wenn ihr Einsatz kritisch reflektiert wird."]}]}],Nn=[{label:"Peer Learning",title:"Voneinander lernen.",description:"In offenen Lerngruppen probieren wir KI aus und machen sichtbar, was wir dabei lernen. Ein kurzer Impuls genügt, um gemein
