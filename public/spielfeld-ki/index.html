e?",a:"Peers zuerst, dann Dozierende: Der Qualitätscheck ist ein fester Schritt der Challenge-Werkstatt — Peer-Review-Runde mit den 3 Feedback-Fragen, danach fachliche Prüfung durch die Didaktik."},{q:"Welche Plattform trägt das Spiel?",a:"Datenschutzkonform, offen, langfristig nutzbar — und idealerweise OER (z. B. CC BY). Offen bleibt auch der Umgang mit KI-generierten Inhalten und die Rechtefrage. Entscheidung gehört ins Semester — Teil des Lernprozesses."},{q:"Wie viel Struktur braucht Peer Learning, damit es trägt?",a:"So viel, dass es trägt — so wenig, dass es lebt. Rhythmus gibt Halt (wöchentlich, 12 Wochen, 4–5 Personen, rotierende Moderation); Inhalte bestimmt der Kreis selbst."},{q:"Wer pflegt das Spiel nach dem Semester weiter?",a:"Die nächste Kohorte ergänzt neue Challenges — das Spiel wächst mit jeder Kohorte. Pflege und OER-Veröffentlichung werden Teil des Demo Day."}];function Wg(){const[h,S]=he.useState(0);return c.jsx("section",{id:"fragen",className:"bg-paper py-16 md:py-24",children:c.jsxs("div",{className:"mx-auto max-w-7xl px-4 sm:px-6",children:[c.jsx(zl,{eyebrow:"08 — Wissen & offene Fragen",title:c.jsxs(c.Fragment,{children:["Ein Raum voller Wissen —"," ",c.jsx("span",{className:"italic text-coral",children:"und guter Fragen."})]})}),c.jsxs("div",{className:"grid gap-8 lg:grid-cols-12 lg:gap-12",children:[c.jsx("div",{className:"lg:col-span-5",children:c.jsxs("div",{className:"flex h-full flex-col rounded-3xl border-2 border-ink bg-pine p-6 text-cream shadow-hard sm:p-8",children:[c.jsxs("p",{className:"flex items-center gap-2 font-sans text-[10px] font-bold uppercase tracking-[0.24em] text-sun",children:[c.jsx(K2,{size:16,strokeWidth:2.4}),"Der Informationsraum"]}),c.jsxs("h3",{className:"mt-3 font-display text-2xl font-black leading-tight text-cream sm:text-3xl",children:["Wissen bleibt"," ",c.jsx("span",{className:"italic text-sun",children:"im Spielfeld."})]}),c.jsx("p",{className:"mt-3 text-sm leading-relaxed text-cream/80",children:"Ein
